<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010f;
    font-family: system-ui, sans-serif; }
  canvas#c { width: 100%; height: 100%; display: block; outline: none; }
  #title { position: fixed; top: 18px; left: 22px; color: #ff5ad1;
    font-weight: 800; letter-spacing: 3px; font-size: 15px; opacity: 0.9;
    text-shadow: 0 0 12px rgba(255, 90, 209, 0.6); }
  #title small { display: block; color: #7dfcf3; font-weight: 600;
    letter-spacing: 1px; font-size: 10px; margin-top: 3px; }
  #msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #8dffcf; font: 700 15px monospace; letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(90, 255, 190, 0.5); text-align: center; }
  #speedbox { position: fixed; left: 26px; bottom: 22px; display: flex;
    align-items: center; gap: 14px; }
  #indL, #indR { color: #ffb038; font-size: 26px; opacity: 0.12;
    text-shadow: 0 0 12px rgba(255, 176, 56, 0.8); }
  #speed { color: #7dfcf3; font: 800 30px monospace;
    text-shadow: 0 0 10px rgba(125, 252, 243, 0.5); }
  #map { position: fixed; right: 22px; bottom: 22px; width: 200px;
    height: 200px; border-radius: 4px;
    box-shadow: 0 0 18px rgba(60, 255, 190, 0.25); }
  #diag { position: fixed; left: 22px; bottom: 70px; color: #ffb0c8;
    font: 600 13px monospace; max-width: 70vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">NEON CITY
  <small>a Turbo Esprit tribute · W/S drive · A/D lane · Q/E indicate</small></div>
<div id="msg"></div>
<div id="speedbox">
  <span id="indL">&#9664;</span>
  <span id="speed">0 MPH</span>
  <span id="indR">&#9654;</span>
</div>
<canvas id="map" width="200" height="200"></canvas>
<div id="diag"></div>
<script src="vendor/engine.js"></script>
</body>
</html>
