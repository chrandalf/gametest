<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010f;
    font-family: system-ui, sans-serif; }
  canvas#c { width: 100%; height: 100%; display: block; outline: none; }
  #title { position: fixed; top: 18px; left: 22px; color: #ff5ad1;
    font-weight: 800; letter-spacing: 3px; font-size: 15px; opacity: 0.9;
    text-shadow: 0 0 12px rgba(255, 90, 209, 0.6); }
  #title small { display: block; color: #7dfcf3; font-weight: 600;
    letter-spacing: 1px; font-size: 10px; margin-top: 3px; }
  #msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #8dffcf; font: 700 15px monospace; letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(90, 255, 190, 0.5); text-align: center; }
  #speedbox { position: fixed; left: 26px; bottom: 22px; display: flex;
    align-items: center; gap: 14px; }
  #indL, #indR { color: #ffb038; font-size: 26px; opacity: 0.12;
    text-shadow: 0 0 12px rgba(255, 176, 56, 0.8); }
  #speed { color: #7dfcf3; font: 800 30px monospace;
    text-shadow: 0 0 10px rgba(125, 252, 243, 0.5); }
  #map { position: fixed; right: 22px; bottom: 22px; width: 200px;
    height: 200px; border-radius: 4px;
    box-shadow: 0 0 18px rgba(60, 255, 190, 0.25); }
  #diag { position: fixed; left: 22px; bottom: 70px; color: #ffb0c8;
    font: 600 13px monospace; max-width: 70vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">NEON CITY
  <small>a Turbo Esprit tribute · W/S drive · A/D lane · Q/E indicate</small></div>
<div id="msg"></div>
<div id="tgtbox" style="position:fixed;top:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:#ff8f8f;font:700 13px monospace;text-shadow:0 0 8px rgba(255,110,110,0.5)">
  <span id="tgt" style="display:inline-block;font-size:20px">&#9650;</span>
  <span id="tgtd"></span>
</div>
<div id="speedbox">
  <span id="indL">&#9664;</span>
  <span id="speed">0 MPH</span>
  <span id="indR">&#9654;</span>
</div>
<div style="position:fixed;left:26px;bottom:64px;width:170px">
  <div style="color:#7dfcf3;font:700 9px monospace;letter-spacing:2px">TURBO</div>
  <div style="height:6px;background:rgba(125,252,243,0.15);border-radius:3px;margin:2px 0 6px">
    <div id="turbo" style="height:100%;width:100%;background:#7dfcf3;border-radius:3px;box-shadow:0 0 8px rgba(125,252,243,0.7)"></div></div>
  <div style="color:#ffd34d;font:700 9px monospace;letter-spacing:2px">FUEL</div>
  <div style="height:6px;background:rgba(255,211,77,0.15);border-radius:3px;margin-top:2px">
    <div id="fuel" style="height:100%;width:100%;background:#ffd34d;border-radius:3px;box-shadow:0 0 8px rgba(255,211,77,0.6)"></div></div>
</div>
<canvas id="map" width="200" height="200"></canvas>
<div id="fps" style="position:fixed;right:22px;top:18px;color:#7dfcf3;font:700 13px monospace;text-shadow:0 0 8px rgba(125,252,243,0.4)"></div>
<div id="diag"></div>
<script src="vendor/engine.js"></script>
</body>
</html>
